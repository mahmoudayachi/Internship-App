
<body>
    <form [formGroup]="loginform" >
      <div class="login-container">
        <div class="login-card">
    
            <h2>Admin portal</h2>
                <label>Email</label>
                <input formControlName="email"  type="email" placeholder="Enter your email">
                 
                <label>Password</label>
                <input formControlName="password" type="password" placeholder="Enter your password">
    
                <button (click)="adminlogin()" type="submit" class="login-btn">Login</button>
          
        </div>
    </div>
    </form>  
    </body>
    
    
    <ng-template #successDialog let-data>
      <h2 mat-dialog-title>{{ data.title }}</h2>
      <mat-dialog-content>
        <p>{{ data.message }}</p>
      </mat-dialog-content>
      <mat-dialog-actions >
        <button mat-button mat-dialog-close color="primary">OK</button>
      </mat-dialog-actions>
    </ng-template>
