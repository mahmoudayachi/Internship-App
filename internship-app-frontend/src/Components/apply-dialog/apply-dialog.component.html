<h2 mat-dialog-title class="dialog-title">Apply Form</h2>

<mat-dialog-content class="mat-typography apply-dialog-content">
  <div class="form-group">
    <label for="cv-upload">Upload CV</label>
    <input  (change)="onCvSelected($event)" type="file" id="cv-upload" required>
  </div>

  <div class="form-group">
    <label for="motivation-upload">Upload Motivation Letter</label>
    <input  (change)="onMotivationSelected($event) "type="file" id="motivation-upload" required>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button (click)="submit()" color="primary" [mat-dialog-close]="true" cdkFocusInitial>Apply</button>
</mat-dialog-actions>
