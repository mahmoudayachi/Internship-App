<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f4f6f8; padding:20px;">

<div style="max-width:600px; margin:auto; background:#ffffff; padding:20px; border-radius:8px;">

    <h2 style="color:#2ecc71;">Company Account Activated</h2>

    <p>
        Hello <strong th:text="${companyName}"></strong>,
    </p>

    <p>
        We’re happy to inform you that your company account on the
        <strong>Internship Portal</strong> has been
        <span style="color:#2ecc71; font-weight:bold;">ACTIVATED</span>.
    </p>

    <p>
        You can now log in and start posting internship offers and reviewing
        student applications.
    </p>

    <br>

    <a th:href="${loginUrl}"
       style="display:inline-block; padding:12px 20px; background:#3498db;
              color:#ffffff; text-decoration:none; border-radius:6px;">
        Login to Company Dashboard
    </a>

    <br><br>

    <p>
        Best regards,<br>
        <strong>Internship Portal Team</strong>
    </p>

</div>

</body>
</html>
